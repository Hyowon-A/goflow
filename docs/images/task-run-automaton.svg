<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 460" width="980" height="460" role="img" aria-labelledby="tr-title tr-desc">
  <title id="tr-title">Task run state automaton</title>
  <desc id="tr-desc">States shown: pending, queued, running, completed, retry_wait, dead_letter. pending to queued to running. running to completed, retry_wait or dead_letter. retry_wait back to queued. completed and dead_letter are terminal states.</desc>
  <style>
    .node-fill { fill: #f6f7f9; }
    .node-border { stroke: #24292f; stroke-width: 1.8; }
    .terminal-outer { fill: none; stroke: #24292f; stroke-width: 1.4; }
    .text { fill: #1a1a1a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 600; text-anchor: middle; }
    .caption { fill: #57606a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 12px; }
    .edge { stroke: #57606a; stroke-width: 1.6; fill: none; }
    .edge-fill { fill: #57606a; }
    @media (prefers-color-scheme: dark) {
      .node-fill { fill: #2d333b; }
      .node-border { stroke: #adbac7; }
      .terminal-outer { stroke: #adbac7; }
      .text { fill: #cdd9e5; }
      .caption { fill: #909dab; }
      .edge { stroke: #909dab; }
      .edge-fill { fill: #909dab; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="edge-fill"/>
    </marker>
  </defs>

  <!-- pending -> queued -> running -->
  <path d="M180,95 L260,95" class="edge" marker-end="url(#arrow)"/>
  <path d="M400,95 L480,95" class="edge" marker-end="url(#arrow)"/>

  <!-- running -> completed / retry_wait / dead_letter -->
  <path d="M620,82 Q690,55 736,45" class="edge" marker-end="url(#arrow)"/>
  <path d="M550,120 C550,178 548,226 546,280" class="edge" marker-end="url(#arrow)"/>
  <path d="M620,110 Q700,240 736,360" class="edge" marker-end="url(#arrow)"/>

  <!-- retry_wait -> queued (retry loop) -->
  <path d="M500,280 C 430,220 380,160 335,122" class="edge" marker-end="url(#arrow)"/>

  <rect x="40" y="70" width="140" height="50" rx="10" class="node-fill node-border"/>
  <text x="110" y="100" class="text">PENDING</text>

  <rect x="260" y="70" width="140" height="50" rx="10" class="node-fill node-border"/>
  <text x="330" y="100" class="text">QUEUED</text>

  <rect x="480" y="70" width="140" height="50" rx="10" class="node-fill node-border"/>
  <text x="550" y="100" class="text">RUNNING</text>

  <rect x="736" y="14" width="176" height="62" rx="12" class="terminal-outer"/>
  <rect x="742" y="20" width="164" height="50" rx="9" class="node-fill node-border"/>
  <text x="824" y="50" class="text">COMPLETED</text>

  <rect x="460" y="280" width="170" height="50" rx="10" class="node-fill node-border"/>
  <text x="545" y="310" class="text">RETRY_WAIT</text>

  <rect x="736" y="334" width="186" height="62" rx="12" class="terminal-outer"/>
  <rect x="742" y="340" width="174" height="50" rx="9" class="node-fill node-border"/>
  <text x="829" y="370" class="text">DEAD_LETTER</text>

  <text x="20" y="440" class="caption">Double border = terminal state. Retry loop: retry_wait -&gt; queued.</text>
</svg>
