services:
  postgres:
    image: postgres:17-alpine
    container_name: goflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: goflow
      POSTGRES_USER: goflow
      POSTGRES_PASSWORD: goflow
    ports:
      - "5433:5432"
    volumes:
      - goflow_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goflow -d goflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  goflow_postgres_data:
